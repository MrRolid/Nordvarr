name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, openssl, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, curl, openssl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [phpunit, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola, že tag odpovídá souboru VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - run: bin/build-release.sh
      - name: Release se zipem
        env:
          GH_TOKEN: ${{ github.token }}
        # Release mohl vzniknout ručně na webu GitHubu (spolu s tagem): pak se zip jen přiloží.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/nordvarr-*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/nordvarr-*.zip --title "Nordvarr ${GITHUB_REF_NAME}" --generate-notes
          fi
