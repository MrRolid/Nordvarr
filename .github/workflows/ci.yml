name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Ruční spuštění na main: vydá release podle souboru VERSION (tag vznikne sám).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, openssl, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, curl, openssl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [phpunit, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag podle souboru VERSION
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} neodpovídá souboru VERSION ($TAG)." >&2
            exit 1
          fi
          # Při ručním spuštění nesmí existující tag ukazovat na jiný commit (vydání by obsahovalo jiný kód).
          EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ -n "$EXISTING" ] && [ "$EXISTING" != "${GITHUB_SHA}" ]; then
            echo "Tag $TAG už existuje a ukazuje na jiný commit ($EXISTING). Zvyšte VERSION nebo tag smažte." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - run: bin/build-release.sh
      - name: Release se zipem
        env:
          GH_TOKEN: ${{ github.token }}
        # Release mohl vzniknout ručně na webu GitHubu (spolu s tagem): pak se zip jen přiloží.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/nordvarr-*.zip --clobber
          else
            gh release create "$TAG" dist/nordvarr-*.zip --target "${GITHUB_SHA}" --title "Nordvarr $TAG" --generate-notes
          fi
